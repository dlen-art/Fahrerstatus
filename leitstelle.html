<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fahrerstatus – Leitstelle</title>

    <style>

        body {
            margin: 0;
            padding: 30px;
            background: #202124;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            max-width: 1250px;
            margin: auto;
        }

        .kopfbereich {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 25px;
        }

        .titelbereich h1 {
            font-size: 36px;
            margin: 0 0 5px 0;
        }

        .untertitel {
            color: #aaaaaa;
            font-size: 18px;
        }

        .archiv-button {
            display: inline-block;
            background: #2d7ff9;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 14px 20px;
            border-radius: 12px;
            white-space: nowrap;
        }

        .archiv-button:hover {
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #2b2c2f;
            border-radius: 14px;
            overflow: hidden;
        }

        th {
            background: #35363a;
            padding: 18px;
            text-align: left;
            font-size: 18px;
        }

        td {
            padding: 18px;
            border-top: 1px solid #444;
            font-size: 20px;
        }

        .tour-zeile {
            cursor: pointer;
            transition: background 0.15s;
        }

        .tour-zeile:hover {
            background: #35363a;
        }

        .status-angekommen {
            color: #18c964;
            font-weight: bold;
        }

        .status-abfahrt {
            color: #2d7ff9;
            font-weight: bold;
        }

        .status-rueckweg {
            color: #f5a524;
            font-weight: bold;
        }

        .status-offen {
            color: #9aa0a6;
            font-weight: bold;
        }

        .seit {
            color: #b7b7b7;
            font-size: 17px;
            white-space: nowrap;
        }

        .historie-zeile {
            display: none;
        }

        .historie-zeile.offen {
            display: table-row;
        }

        .historie-zelle {
            padding: 0;
            background: #18191b;
        }

        .historie-box {
            padding: 22px 28px 26px 55px;
        }

        .historie-titel {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .historie-hinweis {
            color: #8f9398;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .historie-scroll {
            max-height: 390px;
            overflow-y: auto;
            border-radius: 10px;
            background: #242528;
        }

        .historie-eintrag {
            display: grid;
            grid-template-columns: 120px 120px 1fr 200px;
            gap: 15px;
            padding: 14px 18px;
            border-bottom: 1px solid #3b3c3f;
            align-items: center;
            font-size: 17px;
        }

        .historie-eintrag:last-child {
            border-bottom: none;
        }

        .historie-datum {
            color: #aaa;
        }

        .historie-zeit {
            font-weight: bold;
        }

        .historie-fahrer {
            color: #ccc;
        }

        .historie-leer {
            color: #999;
            padding: 18px;
        }

        @media (max-width: 900px) {

            body {
                padding: 15px;
            }

            .kopfbereich {
                flex-direction: column;
            }

            .titelbereich h1 {
                font-size: 28px;
            }

            .archiv-button {
                width: 100%;
                text-align: center;
                box-sizing: border-box;
            }

            .historie-box {
                padding: 18px;
            }

            .historie-eintrag {
                grid-template-columns: 1fr 1fr;
            }

            th,
            td {
                padding: 12px 10px;
                font-size: 16px;
            }

            .seit {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <div class="kopfbereich">

        <div class="titelbereich">

            <h1>🚚 Fahrerstatus – Leitstelle</h1>

            <div class="untertitel">
                Live-Übersicht der aktuellen Touren
            </div>

        </div>


        <a class="archiv-button" href="archiv.html">
            📁 Archiv
        </a>

    </div>


    <table>

        <thead>

            <tr>
                <th>Tour</th>
                <th>Fahrer</th>
                <th>Schicht</th>
                <th>Status</th>
                <th>Zeit</th>
                <th>Seit</th>
            </tr>

        </thead>


        <tbody id="statusListe">
        </tbody>

    </table>

</div>



<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
        getDatabase,
        ref,
        onValue,
        get
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";



    const firebaseConfig = {

        apiKey: "AIzaSyAY_J2fSlFdkZLIwcovITrcPulhgSpDgfC",

        authDomain: "fahrerstatus.firebaseapp.com",

        databaseURL:
            "https://fahrerstatus-default-rtdb.europe-west1.firebasedatabase.app",

        projectId: "fahrerstatus",

        storageBucket: "fahrerstatus.firebasestorage.app",

        messagingSenderId: "649331574277",

        appId:
            "1:649331574277:web:eec4f352f995da9ba9be6c"

    };



    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);

    const statusRef = ref(database, "status");



    const aktiveTouren = [

        "4001",
        "4003",
        "4004",
        "4005",
        "4006",
        "4010",
        "4011",
        "4013",
        "4028",
        "4031",
        "5010",
        "5011",
        "5026",
        "5032"

    ];


    let aktuelleStatusDaten = {};



    function statusDarstellen(status) {

        if (status === "Angekommen") {

            return {
                text: "🟢 Angekommen",
                klasse: "status-angekommen"
            };

        }


        if (status === "Abfahrt") {

            return {
                text: "🔵 Abfahrt",
                klasse: "status-abfahrt"
            };

        }


        if (status === "Rückweg") {

            return {
                text: "🟡 Rückweg",
                klasse: "status-rueckweg"
            };

        }


        return {
            text: status || "⚪ Noch keine Meldung",
            klasse: "status-offen"
        };

    }



    function seitText(timestamp) {

        if (!timestamp) {
            return "-";
        }


        const jetzt =
            Date.now();


        let differenz =
            jetzt - timestamp;


        if (differenz < 0) {
            differenz = 0;
        }


        const sekunden =
            Math.floor(differenz / 1000);


        const minuten =
            Math.floor(sekunden / 60);


        const stunden =
            Math.floor(minuten / 60);


        const tage =
            Math.floor(stunden / 24);


        if (sekunden < 60) {
            return "gerade eben";
        }


        if (minuten < 60) {
            return "vor " + minuten + " Min.";
        }


        if (stunden < 24) {

            const restMinuten =
                minuten % 60;


            if (restMinuten === 0) {
                return "vor " + stunden + " Std.";
            }


            return (
                "vor " +
                stunden +
                " Std. " +
                restMinuten +
                " Min."
            );

        }


        if (tage === 1) {
            return "vor 1 Tag";
        }


        return "vor " + tage + " Tagen";

    }



    function seitAnzeigeAktualisieren() {

        document
            .querySelectorAll("[data-timestamp]")
            .forEach(function(element) {

                const timestamp =
                    Number(
                        element.getAttribute(
                            "data-timestamp"
                        )
                    );


                element.textContent =
                    seitText(timestamp);

            });

    }



    async function archivOeffnen(
        tourNummer,
        historieZeile
    ) {

        if (
            historieZeile.classList.contains(
                "offen"
            )
        ) {

            historieZeile.classList.remove(
                "offen"
            );

            return;

        }


        document
            .querySelectorAll(
                ".historie-zeile.offen"
            )
            .forEach(function(zeile) {

                zeile.classList.remove(
                    "offen"
                );

            });


        historieZeile.classList.add(
            "offen"
        );


        const historieInhalt =
            historieZeile.querySelector(
                ".historie-scroll"
            );


        historieInhalt.innerHTML =
            "<div class='historie-leer'>" +
            "Wird geladen..." +
            "</div>";


        try {

            const archivRef =
                ref(
                    database,
                    "archiv/" + tourNummer
                );


            const snapshot =
                await get(archivRef);


            if (!snapshot.exists()) {

                historieInhalt.innerHTML =

                    "<div class='historie-leer'>" +
                    "Noch keine Meldungen vorhanden." +
                    "</div>";

                return;

            }


            const daten =
                snapshot.val();


            let eintraege =
                Object.values(daten);


            eintraege.sort(
                function(a, b) {

                    return (
                        (b.timestamp || 0) -
                        (a.timestamp || 0)
                    );

                }
            );


            eintraege =
                eintraege.slice(0, 36);


            historieInhalt.innerHTML = "";


            eintraege.forEach(
                function(eintrag) {

                    const status =
                        statusDarstellen(
                            eintrag.status
                        );


                    const zeile =
                        document.createElement(
                            "div"
                        );


                    zeile.className =
                        "historie-eintrag";


                    zeile.innerHTML =

                        "<div class='historie-datum'>" +
                            (eintrag.datum || "-") +
                        "</div>" +

                        "<div class='historie-zeit'>" +
                            (eintrag.zeit || "-") +
                        "</div>" +

                        "<div class='" +
                            status.klasse +
                        "'>" +
                            status.text +
                        "</div>" +

                        "<div class='historie-fahrer'>" +
                            (eintrag.fahrer || "-") +
                        "</div>";


                    historieInhalt.appendChild(
                        zeile
                    );

                }
            );


        }

        catch (fehler) {

            historieInhalt.innerHTML =

                "<div class='historie-leer'>" +
                "Archiv konnte nicht geladen werden." +
                "</div>";


            console.error(fehler);

        }

    }



    function leitstelleDarstellen() {

        const liste =
            document.getElementById(
                "statusListe"
            );


        liste.innerHTML = "";


        aktiveTouren.forEach(
            function(tourNummer) {

                const eintrag =
                    aktuelleStatusDaten[
                        tourNummer
                    ];


                let fahrer = "-";
                let schicht = "-";
                let zeit = "-";
                let timestamp = 0;

                let status =
                    statusDarstellen(null);


                if (eintrag) {

                    fahrer =
                        eintrag.fahrer || "-";

                    schicht =
                        eintrag.schicht || "-";

                    zeit =
                        eintrag.zeit || "-";

                    timestamp =
                        eintrag.timestamp || 0;

                    status =
                        statusDarstellen(
                            eintrag.status
                        );

                }



                const zeile =
                    document.createElement(
                        "tr"
                    );


                zeile.className =
                    "tour-zeile";


                zeile.innerHTML =

                    "<td><b>" +
                        tourNummer +
                    "</b></td>" +

                    "<td>" +
                        fahrer +
                    "</td>" +

                    "<td>" +
                        schicht +
                    "</td>" +

                    "<td class='" +
                        status.klasse +
                    "'>" +
                        status.text +
                    "</td>" +

                    "<td>" +
                        zeit +
                    "</td>" +

                    "<td class='seit' " +
                    "data-timestamp='" +
                        timestamp +
                    "'>" +
                        seitText(timestamp) +
                    "</td>";



                const historieZeile =
                    document.createElement(
                        "tr"
                    );


                historieZeile.className =
                    "historie-zeile";


                historieZeile.innerHTML =

                    "<td colspan='6' " +
                    "class='historie-zelle'>" +

                        "<div class='historie-box'>" +

                            "<div class='historie-titel'>" +
                                "Verlauf – Tour " +
                                tourNummer +
                            "</div>" +

                            "<div class='historie-hinweis'>" +
                                "Letzte 36 Meldungen" +
                            "</div>" +

                            "<div class='historie-scroll'>" +

                                "<div class='historie-leer'>" +
                                    "Archiv laden..." +
                                "</div>" +

                            "</div>" +

                        "</div>" +

                    "</td>";



                zeile.addEventListener(

                    "click",

                    function() {

                        archivOeffnen(
                            tourNummer,
                            historieZeile
                        );

                    }

                );


                liste.appendChild(
                    zeile
                );

                liste.appendChild(
                    historieZeile
                );

            }
        );


        seitAnzeigeAktualisieren();

    }



    onValue(
        statusRef,
        function(snapshot) {

            aktuelleStatusDaten =
                snapshot.val() || {};


            leitstelleDarstellen();

        }
    );



    setInterval(
        seitAnzeigeAktualisieren,
        60000
    );

</script>


</body>

</html>
