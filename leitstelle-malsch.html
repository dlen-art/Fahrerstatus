<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fahrerstatus – Leitstelle Malsch</title>

    <style>

        body {
            margin: 0;
            padding: 30px;
            background: #202124;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            max-width: 1350px;
            margin: auto;
        }

        .kopfbereich {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 25px;
        }

        .titelbereich h1 {
            font-size: 36px;
            margin: 0 0 5px 0;
        }

        .untertitel {
            color: #aaaaaa;
            font-size: 18px;
        }

        .kopf-buttons {
            display: flex;
            gap: 12px;
        }

        .kopf-button {
            display: inline-block;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 14px 20px;
            border-radius: 12px;
            white-space: nowrap;
        }

        .archiv-button {
            background: #2d7ff9;
        }

        .bischweier-button {
            background: #55585d;
        }

        .kopf-button:hover {
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #2b2c2f;
            border-radius: 14px;
            overflow: hidden;
        }

        th {
            background: #35363a;
            padding: 18px;
            text-align: left;
            font-size: 18px;
        }

        td {
            padding: 18px;
            border-top: 1px solid #444;
            font-size: 20px;
        }

        .tour-zeile {
            cursor: pointer;
            transition: background 0.15s;
        }

        .tour-zeile:hover {
            background: #35363a;
        }

        .tour-zeile.warnung {
            background: rgba(220, 53, 69, 0.18);
        }

        .tour-zeile.warnung:hover {
            background: rgba(220, 53, 69, 0.27);
        }

        .status-angekommen {
            color: #18c964;
            font-weight: bold;
        }

        .status-abfahrt {
            color: #2d7ff9;
            font-weight: bold;
        }

        .status-rueckweg {
            color: #f5a524;
            font-weight: bold;
        }

        .status-offen {
            color: #9aa0a6;
            font-weight: bold;
        }

        .seit {
            color: #b7b7b7;
            font-size: 17px;
            white-space: nowrap;
        }

        .kontrolle {
            font-size: 16px;
            white-space: nowrap;
        }

        .kontrolle-ok {
            color: #8f9398;
        }

        .kontrolle-warnung {
            color: #ff6b6b;
            font-weight: bold;
        }

        .historie-zeile {
            display: none;
        }

        .historie-zeile.offen {
            display: table-row;
        }

        .historie-zelle {
            padding: 0;
            background: #18191b;
        }

        .historie-box {
            padding: 22px 28px 26px 55px;
        }

        .historie-titel {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .historie-hinweis {
            color: #8f9398;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .historie-scroll {
            max-height: 390px;
            overflow-y: auto;
            border-radius: 10px;
            background: #242528;
        }

        .historie-eintrag {
            display: grid;
            grid-template-columns: 120px 120px 1fr 200px;
            gap: 15px;
            padding: 14px 18px;
            border-bottom: 1px solid #3b3c3f;
            align-items: center;
            font-size: 17px;
        }

        .historie-eintrag:last-child {
            border-bottom: none;
        }

        .historie-datum {
            color: #aaa;
        }

        .historie-zeit {
            font-weight: bold;
        }

        .historie-fahrer {
            color: #ccc;
        }

        .historie-leer {
            color: #999;
            padding: 18px;
        }

        @media (max-width: 1050px) {

            body {
                padding: 15px;
            }

            .kopfbereich {
                flex-direction: column;
            }

            .titelbereich h1 {
                font-size: 28px;
            }

            .kopf-buttons {
                width: 100%;
            }

            .kopf-button {
                flex: 1;
                text-align: center;
                box-sizing: border-box;
            }

            th,
            td {
                padding: 12px 9px;
                font-size: 15px;
            }

            .seit,
            .kontrolle {
                font-size: 14px;
            }

            .historie-box {
                padding: 18px;
            }

            .historie-eintrag {
                grid-template-columns: 1fr 1fr;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="kopfbereich">

        <div class="titelbereich">

            <h1>🚚 Fahrerstatus – Leitstelle Malsch</h1>

            <div class="untertitel">
                Live-Übersicht der aktuellen Touren
            </div>

        </div>

        <div class="kopf-buttons">

            <a class="kopf-button archiv-button" href="archiv.html">
                📁 Archiv
            </a>

            <a class="kopf-button bischweier-button" href="leitstelle.html">
                🏢 Bischweier
            </a>

        </div>

    </div>

    <table>

        <thead>

            <tr>
                <th>Tour</th>
                <th>Fahrer</th>
                <th>Schicht</th>
                <th>Status</th>
                <th>Zeit</th>
                <th>Seit</th>
                <th>Kontrolle</th>
            </tr>

        </thead>

        <tbody id="statusListe">
        </tbody>

    </table>

</div>

<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
        getDatabase,
        ref,
        onValue,
        get
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

    const firebaseConfig = {

        apiKey: "AIzaSyAY_J2fSlFdkZLIwcovITrcPulhgSpDgfC",

        authDomain: "fahrerstatus.firebaseapp.com",

        databaseURL:
            "https://fahrerstatus-default-rtdb.europe-west1.firebasedatabase.app",

        projectId: "fahrerstatus",

        storageBucket: "fahrerstatus.firebasestorage.app",

        messagingSenderId: "649331574277",

        appId:
            "1:649331574277:web:eec4f352f995da9ba9be6c"

    };

    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);

    const statusRef = ref(database, "status");

    const aktiveTouren = [

        "4002",
        "4020",
        "IVM 1",
        "IVM 2",
        "Kombi-Route",
        "5022",
        "5003",
        "5020",
        "5001",
        "SoFa Malsch",
        "All",
        "Tech. Absicherung"

    ];

    const ABFAHRT_MAX_MINUTEN = 80;

    let aktuelleStatusDaten = {};

    function statusDarstellen(status) {

        if (status === "Angekommen") {

            return {
                text: "🟢 Angekommen",
                klasse: "status-angekommen"
            };

        }

        if (status === "Abfahrt") {

            return {
                text: "🔵 Abfahrt",
                klasse: "status-abfahrt"
            };

        }

        if (status === "Rückweg") {

            return {
                text: "🟡 Rückweg",
                klasse: "status-rueckweg"
            };

        }

        return {
            text: status || "⚪ Noch keine Meldung",
            klasse: "status-offen"
        };

    }

    function vergangeneMinuten(timestamp) {

        if (!timestamp) {
            return 0;
        }

        const differenz =
            Date.now() - timestamp;

        if (differenz <= 0) {
            return 0;
        }

        return Math.floor(
            differenz / 60000
        );

    }

    function seitText(timestamp) {

        if (!timestamp) {
            return "-";
        }

        let differenz =
            Date.now() - timestamp;

        if (differenz < 0) {
            differenz = 0;
        }

        const sekunden =
            Math.floor(differenz / 1000);

        const minuten =
            Math.floor(sekunden / 60);

        const stunden =
            Math.floor(minuten / 60);

        const tage =
            Math.floor(stunden / 24);

        if (sekunden < 60) {
            return "gerade eben";
        }

        if (minuten < 60) {
            return "vor " + minuten + " Min.";
        }

        if (stunden < 24) {

            const restMinuten =
                minuten % 60;

            if (restMinuten === 0) {

                return (
                    "vor " +
                    stunden +
                    " Std."
                );

            }

            return (
                "vor " +
                stunden +
                " Std. " +
                restMinuten +
                " Min."
            );

        }

        if (tage === 1) {
            return "vor 1 Tag";
        }

        return (
            "vor " +
            tage +
            " Tagen"
        );

    }

    function kontrolleBerechnen(eintrag) {

        if (
            !eintrag ||
            !eintrag.timestamp ||
            !eintrag.status
        ) {

            return {
                warnung: false,
                text: "-"
            };

        }

        const minuten =
            vergangeneMinuten(
                eintrag.timestamp
            );

        if (
            eintrag.status === "Abfahrt" &&
            minuten > ABFAHRT_MAX_MINUTEN
        ) {

            const ueberfaellig =
                minuten -
                ABFAHRT_MAX_MINUTEN;

            return {
                warnung: true,
                text:
                    "⚠️ Rückweg überfällig – " +
                    ueberfaellig +
                    " Min."
            };

        }

        if (eintrag.status === "Abfahrt") {

            const verbleibend =
                ABFAHRT_MAX_MINUTEN -
                minuten;

            return {
                warnung: false,
                text:
                    "Rückweg in " +
                    verbleibend +
                    " Min."
            };

        }

        if (
            eintrag.status === "Angekommen" ||
            eintrag.status === "Rückweg"
        ) {

            return {
                warnung: false,
                text: "✓"
            };

        }

        return {
            warnung: false,
            text: "-"
        };

    }

    async function archivOeffnen(
        tourNummer,
        historieZeile
    ) {

        if (
            historieZeile.classList.contains(
                "offen"
            )
        ) {

            historieZeile.classList.remove(
                "offen"
            );

            return;

        }

        document
            .querySelectorAll(
                ".historie-zeile.offen"
            )
            .forEach(function(zeile) {

                zeile.classList.remove(
                    "offen"
                );

            });

        historieZeile.classList.add(
            "offen"
        );

        const historieInhalt =
            historieZeile.querySelector(
                ".historie-scroll"
            );

        historieInhalt.innerHTML =
            "<div class='historie-leer'>" +
            "Wird geladen..." +
            "</div>";

        try {

            const archivRef =
                ref(
                    database,
                    "archiv/" + tourNummer
                );

            const snapshot =
                await get(archivRef);

            if (!snapshot.exists()) {

                historieInhalt.innerHTML =
                    "<div class='historie-leer'>" +
                    "Noch keine Meldungen vorhanden." +
                    "</div>";

                return;

            }

            const daten =
                snapshot.val();

            let eintraege =
                Object.values(daten);

            eintraege.sort(
                function(a, b) {

                    return (
                        (b.timestamp || 0) -
                        (a.timestamp || 0)
                    );

                }
            );

            eintraege =
                eintraege.slice(0, 36);

            historieInhalt.innerHTML = "";

            eintraege.forEach(
                function(eintrag) {

                    const status =
                        statusDarstellen(
                            eintrag.status
                        );

                    const zeile =
                        document.createElement(
                            "div"
                        );

                    zeile.className =
                        "historie-eintrag";

                    zeile.innerHTML =

                        "<div class='historie-datum'>" +
                            (eintrag.datum || "-") +
                        "</div>" +

                        "<div class='historie-zeit'>" +
                            (eintrag.zeit || "-") +
                        "</div>" +

                        "<div class='" +
                            status.klasse +
                        "'>" +
                            status.text +
                        "</div>" +

                        "<div class='historie-fahrer'>" +
                            (eintrag.fahrer || "-") +
                        "</div>";

                    historieInhalt.appendChild(
                        zeile
                    );

                }
            );

        }

        catch (fehler) {

            historieInhalt.innerHTML =
                "<div class='historie-leer'>" +
                "Archiv konnte nicht geladen werden." +
                "</div>";

            console.error(fehler);

        }

    }

    function leitstelleDarstellen() {

        const liste =
            document.getElementById(
                "statusListe"
            );

        liste.innerHTML = "";

        aktiveTouren.forEach(
            function(tourNummer) {

                const eintrag =
                    aktuelleStatusDaten[
                        tourNummer
                    ];

                let fahrer = "-";
                let schicht = "-";
                let zeit = "-";
                let timestamp = 0;

                let status =
                    statusDarstellen(null);

                if (eintrag) {

                    fahrer =
                        eintrag.fahrer || "-";

                    schicht =
                        eintrag.schicht || "-";

                    zeit =
                        eintrag.zeit || "-";

                    timestamp =
                        eintrag.timestamp || 0;

                    status =
                        statusDarstellen(
                            eintrag.status
                        );

                }

                const kontrolle =
                    kontrolleBerechnen(
                        eintrag
                    );

                const zeile =
                    document.createElement(
                        "tr"
                    );

                zeile.className =
                    "tour-zeile";

                if (kontrolle.warnung) {

                    zeile.classList.add(
                        "warnung"
                    );

                }

                zeile.innerHTML =

                    "<td><b>" +
                        tourNummer +
                    "</b></td>" +

                    "<td>" +
                        fahrer +
                    "</td>" +

                    "<td>" +
                        schicht +
                    "</td>" +

                    "<td class='" +
                        status.klasse +
                    "'>" +
                        status.text +
                    "</td>" +

                    "<td>" +
                        zeit +
                    "</td>" +

                    "<td class='seit'>" +
                        seitText(timestamp) +
                    "</td>" +

                    "<td class='kontrolle " +
                        (
                            kontrolle.warnung
                            ? "kontrolle-warnung"
                            : "kontrolle-ok"
                        ) +
                    "'>" +
                        kontrolle.text +
                    "</td>";

                const historieZeile =
                    document.createElement(
                        "tr"
                    );

                historieZeile.className =
                    "historie-zeile";

                historieZeile.innerHTML =

                    "<td colspan='7' class='historie-zelle'>" +

                        "<div class='historie-box'>" +

                            "<div class='historie-titel'>" +
                                "Verlauf – Tour " +
                                tourNummer +
                            "</div>" +

                            "<div class='historie-hinweis'>" +
                                "Letzte 36 Meldungen" +
                            "</div>" +

                            "<div class='historie-scroll'>" +

                                "<div class='historie-leer'>" +
                                    "Archiv laden..." +
                                "</div>" +

                            "</div>" +

                        "</div>" +

                    "</td>";

                zeile.addEventListener(

                    "click",

                    function() {

                        archivOeffnen(
                            tourNummer,
                            historieZeile
                        );

                    }

                );

                liste.appendChild(
                    zeile
                );

                liste.appendChild(
                    historieZeile
                );

            }
        );

    }

    onValue(
        statusRef,
        function(snapshot) {

            aktuelleStatusDaten =
                snapshot.val() || {};

            leitstelleDarstellen();

        }
    );

    setInterval(
        leitstelleDarstellen,
        60000
    );

</script>

</body>

</html>
